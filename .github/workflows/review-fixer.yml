---
name: Review pipeline v2 — fixer
# Reusable: invoked from review-pipeline.yml after all reviewers complete.
# Reads every reviewer artifact, runs the agentic fixer with a NARROW
# prompt that only addresses substantive findings the reviewers asked
# for, then, if it produces a commit, pushes that SHA and claims it on
# review/pipeline immediately afterward. Entry-side GO and fixer-owned
# SHA guards prevent redundant follow-up cycles on already-finalized SHAs.
#
# This is the ONLY job in the v2 pipeline that has write permission to
# the PR branch. All reviewers and the judge are read-only.

on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        required: true
      reviewed_sha:
        type: string
        required: true
      head_ref:
        type: string
        required: true
      head_repo:
        type: string
        required: true
      cycle:
        type: string
        required: true
      devcontainer_image:
        type: string
        required: true
    outputs:
      new_sha:
        description: 'SHA after fixer push (== reviewed_sha if no-op)'
        value: ${{ jobs.fix.outputs.new_sha }}
      fix_artifact_name:
        description: 'Artifact name containing fixer-result.json'
        value: ${{ jobs.fix.outputs.fix_artifact_name }}
    secrets:
      WORKFLOW_PAT:
        required: true

permissions:
  # Read-only GITHUB_TOKEN. The fixer's `git push` uses the
  # WORKFLOW_PAT-authenticated remote (set up via the PR-branch
  # actions/checkout step that passes token: secrets.WORKFLOW_PAT),
  # not GITHUB_TOKEN. Same for the `gh api .../statuses` claim and
  # any `gh pr` calls. Actions/checkout for the orchestration
  # workspace only needs read.
  #
  # `actions: read` is required so actions/download-artifact@v4 can
  # fetch the author-session artifact uploaded by the resolve-issue
  # run identified in the PR's `Author-Session:` trailer.
  contents: read
  packages: read
  pull-requests: read
  statuses: read
  actions: read

env:
  PR_WORKSPACE_PATH: pr-head

jobs:
  fix:
    name: Apply reviewer-requested fixes
    runs-on: self-hosted
    outputs:
      new_sha: ${{ steps.push.outputs.new_sha }}
      fix_artifact_name: fix-result-${{ inputs.reviewed_sha }}
    steps:
      - name: Checkout main (for composite actions)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_sha }}
          repository: ${{ inputs.head_repo }}
          path: ${{ env.PR_WORKSPACE_PATH }}
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Sync with main
        # Almost every PR in this repo is AI-authored — there is no
        # reliable human in the loop to resolve merge conflicts when
        # main moves under a PR. Attempt a merge from origin/main here
        # so each fixer cycle keeps the PR mergeable. Three outcomes:
        #
        #   none      PR is already up to date with origin/main → no-op.
        #   clean     Merge applied with no conflicts → commit it on the
        #             host now (single-parent merge commit, no PR-side
        #             content delta). The next pipeline cycle's gather
        #             job will hit the "Inherit prior verdict
        #             (merge-from-main)" short-circuit.
        #   conflicts Merge produced conflict markers → leave markers
        #             in the working tree, surface MERGE_STATE=conflicts
        #             + MERGE_CONFLICT_FILES to the fixer container so
        #             the agent resolves them as part of its run. The
        #             commit step below seals or aborts.
        id: sync-main
        working-directory: ${{ env.PR_WORKSPACE_PATH }}
        env:
          HEAD_REF: ${{ inputs.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "hide-my-list-ci[bot]"
          git config user.email "ci@hide-my-list.local"
          git fetch --depth=50 origin main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "merge_state=none" >> "$GITHUB_OUTPUT"
            echo "conflict_files=" >> "$GITHUB_OUTPUT"
            echo "PR is already up to date with origin/main; no merge needed"
            exit 0
          fi

          if git merge --no-commit --no-ff origin/main; then
            git commit -m "Merge origin/main into ${HEAD_REF}" \
                       -m "Pipeline-driven sync to keep the PR mergeable; no PR-side content delta."
            echo "merge_state=clean" >> "$GITHUB_OUTPUT"
            echo "conflict_files=" >> "$GITHUB_OUTPUT"
            echo "Clean merge from origin/main committed"
          else
            CONFLICT_FILES=$(git diff --name-only --diff-filter=U | tr '\n' ',' | sed 's/,$//')
            echo "merge_state=conflicts" >> "$GITHUB_OUTPUT"
            echo "conflict_files=${CONFLICT_FILES}" >> "$GITHUB_OUTPUT"
            echo "Merge produced conflicts in: ${CONFLICT_FILES}"
            echo "Markers left in working tree; agent will resolve in the fixer step"
          fi

      - name: Download all reviewer artifacts into workspace
        # Must be inside the workspace folder so the devcontainer can
        # see them — host /tmp is NOT bind-mounted into the container.
        uses: actions/download-artifact@v4
        with:
          path: ${{ env.PR_WORKSPACE_PATH }}/.review-output/reviewer-artifacts
          pattern: reviewer-*-${{ inputs.reviewed_sha }}

      - name: Clean stale fixer artifacts from prior runs
        # Prior pipeline runs may have left fixer-result.json and
        # fixer-output.jsonl owned by the runner UID (1001). The Codex
        # fixer runs as UID 1000 inside the container and can't
        # overwrite them. Remove stale files so the fixer starts clean.
        # Also remove near-miss filenames the salvage block may consume
        # (fix-result.json, result.json) so a stale artifact from a
        # prior failed run can't be promoted into fixer-result.json.
        run: |
          rm -f "${PR_WORKSPACE_PATH}/.review-output/fixer-result.json" \
                "${PR_WORKSPACE_PATH}/.review-output/fixer-output.jsonl" \
                "${PR_WORKSPACE_PATH}/.review-output/write-test" \
                "${PR_WORKSPACE_PATH}/.review-output/fix-result.json" \
                "${PR_WORKSPACE_PATH}/.review-output/result.json"

      - name: Create directories for devcontainer mounts
        run: mkdir -p ~/.config/gh ~/.claude ~/.codex

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse Author-Session trailer
        # Three-way fixer dispatch: if the PR body carries an
        # `Author-Session: <agent>/<run-id>` trailer (written by
        # resolve-issue) AND the matching artifact still exists on the
        # original run, resume the original author. Otherwise the fixer
        # is a fresh Claude session, same as before this redesign.
        id: parse-trailer
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          PR_BODY=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.body // ""')

          TRAILER="$(./scripts/ci-session-store.sh parse-trailer "$PR_BODY" || true)"
          AGENT=""
          RUN_ID=""
          if [ -n "$TRAILER" ]; then
            AGENT="$(printf '%s' "$TRAILER" | cut -f1)"
            RUN_ID="$(printf '%s' "$TRAILER" | cut -f2)"
          fi

          ISSUE_NUM=""
          if [ -n "$AGENT" ] && [ -n "$RUN_ID" ]; then
            ISSUE_NUM=$(printf '%s\n' "$PR_BODY" \
              | grep -Eim1 '^(Resolves|Fixes|Closes) #[0-9]+' \
              | sed -E 's/^(Resolves|Fixes|Closes) #([0-9]+).*/\2/' \
              || true)
          fi

          {
            echo "agent=${AGENT}"
            echo "run_id=${RUN_ID}"
            echo "issue_num=${ISSUE_NUM}"
          } >> "$GITHUB_OUTPUT"

          echo "trailer parse: agent=${AGENT:-none} run_id=${RUN_ID:-none} issue=${ISSUE_NUM:-none}"

      # Cross-run download. Requires `actions: read` permission. Failure here
      # (artifact missing/expired/unauthorized) → fallback in detect-session.
      - name: Download author session artifact
        id: download-session
        if: steps.parse-trailer.outputs.agent != '' && steps.parse-trailer.outputs.run_id != '' && steps.parse-trailer.outputs.issue_num != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: author-session-${{ steps.parse-trailer.outputs.agent }}-${{ steps.parse-trailer.outputs.run_id }}
          run-id: ${{ steps.parse-trailer.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/author-session-tar

      - name: Detect author session for resume
        id: detect-session
        env:
          AGENT: ${{ steps.parse-trailer.outputs.agent }}
          RUN_ID: ${{ steps.parse-trailer.outputs.run_id }}
          ISSUE_NUM: ${{ steps.parse-trailer.outputs.issue_num }}
          DOWNLOAD_OUTCOME: ${{ steps.download-session.outcome }}
        run: |
          set -euo pipefail

          MODE="fallback"
          SESSION_HOST_DIR=""

          if [ -n "$AGENT" ] && [ -n "$RUN_ID" ] && [ -n "$ISSUE_NUM" ] && [ "$DOWNLOAD_OUTCOME" = "success" ]; then
            TAR="${RUNNER_TEMP}/author-session-tar/author-session.tgz"
            if [ -f "$TAR" ]; then
              SESSION_HOST_DIR=$(./scripts/ci-session-store.sh unpack "$AGENT" "$ISSUE_NUM" "$RUN_ID" "$TAR")
              if ./scripts/ci-session-store.sh validate "$AGENT" "$ISSUE_NUM" "$RUN_ID" 2>/dev/null; then
                MODE="${AGENT}-resume"
              else
                echo "::warning::Author session artifact downloaded (${AGENT}/${RUN_ID} for #${ISSUE_NUM}) but contents failed validation; falling back to fresh Claude"
                SESSION_HOST_DIR=""
              fi
            else
              echo "::warning::Author session download succeeded but tar not found at ${TAR}; falling back to fresh Claude"
            fi
          elif [ -n "$AGENT" ] && [ -n "$RUN_ID" ]; then
            echo "::warning::Author-Session trailer present (${AGENT}/${RUN_ID}) but artifact download outcome=${DOWNLOAD_OUTCOME}; falling back to fresh Claude"
          fi

          {
            echo "agent=${AGENT}"
            echo "run_id=${RUN_ID}"
            echo "issue_num=${ISSUE_NUM}"
            echo "session_host_dir=${SESSION_HOST_DIR}"
            echo "mode=${MODE}"
          } >> "$GITHUB_OUTPUT"

          echo "fixer dispatch: mode=${MODE} agent=${AGENT:-none} run_id=${RUN_ID:-none} issue=${ISSUE_NUM:-none}"

      - name: Run Codex fixer (resumed author)
        if: steps.detect-session.outputs.mode == 'codex-resume'
        uses: ./.github/actions/review-codex-resume
        with:
          agent: codex
          session_host_dir: ${{ steps.detect-session.outputs.session_host_dir }}
          role: fixer
          prompt_path: .github/scripts/review/prompts/fixer-resume.md
          image: ${{ inputs.devcontainer_image }}
          workspace_folder: ${{ env.PR_WORKSPACE_PATH }}
          pr_number: ${{ inputs.pr_number }}
          reviewed_sha: ${{ inputs.reviewed_sha }}
          cycle: ${{ inputs.cycle }}
          workflow_pat: ${{ secrets.WORKFLOW_PAT }}
          extra_env: |
            REVIEWER_ARTIFACTS_DIR=.review-output/reviewer-artifacts
            MERGE_STATE=${{ steps.sync-main.outputs.merge_state }}
            MERGE_CONFLICT_FILES=${{ steps.sync-main.outputs.conflict_files }}

      - name: Run Claude fixer (resumed author)
        if: steps.detect-session.outputs.mode == 'claude-resume'
        uses: ./.github/actions/review-claude-resume
        with:
          agent: claude
          session_host_dir: ${{ steps.detect-session.outputs.session_host_dir }}
          role: fixer
          prompt_path: .github/scripts/review/prompts/fixer-resume.md
          image: ${{ inputs.devcontainer_image }}
          workspace_folder: ${{ env.PR_WORKSPACE_PATH }}
          pr_number: ${{ inputs.pr_number }}
          reviewed_sha: ${{ inputs.reviewed_sha }}
          cycle: ${{ inputs.cycle }}
          workflow_pat: ${{ secrets.WORKFLOW_PAT }}
          extra_env: |
            REVIEWER_ARTIFACTS_DIR=.review-output/reviewer-artifacts
            MERGE_STATE=${{ steps.sync-main.outputs.merge_state }}
            MERGE_CONFLICT_FILES=${{ steps.sync-main.outputs.conflict_files }}

      - name: Run Claude fixer (fresh fallback)
        if: steps.detect-session.outputs.mode == 'fallback'
        uses: ./.github/actions/review-claude-run
        with:
          role: fixer
          prompt_path: .github/scripts/review/prompts/fixer.md
          image: ${{ inputs.devcontainer_image }}
          workspace_folder: ${{ env.PR_WORKSPACE_PATH }}
          pr_number: ${{ inputs.pr_number }}
          reviewed_sha: ${{ inputs.reviewed_sha }}
          cycle: ${{ inputs.cycle }}
          read_only: 'false'
          workflow_pat: ${{ secrets.WORKFLOW_PAT }}
          extra_env: |
            REVIEWER_ARTIFACTS_DIR=.review-output/reviewer-artifacts
            MERGE_STATE=${{ steps.sync-main.outputs.merge_state }}
            MERGE_CONFLICT_FILES=${{ steps.sync-main.outputs.conflict_files }}

      - name: Resolve fixer artifact path
        # All three fixer paths above write to the same workspace
        # location. Pin the absolute host path here so downstream
        # validate / commit / push / upload steps don't have to
        # branch on which fixer ran.
        id: artifact-path
        run: |
          set -euo pipefail
          BASE="${GITHUB_WORKSPACE}/${{ env.PR_WORKSPACE_PATH }}/.review-output"
          {
            echo "result_json=${BASE}/fixer-result.json"
            echo "output_jsonl=${BASE}/fixer-output.jsonl"
          } >> "$GITHUB_OUTPUT"

      - name: Validate fix-result against schema
        env:
          ARTIFACT: ${{ steps.artifact-path.outputs.result_json }}
        run: |
          set -euo pipefail
          # Schema declares $schema: draft/2020-12. ajv-cli@5 needs an
          # explicit --spec=draft2020 flag to register the meta-schema;
          # without it the schema parse fails with "no schema with key
          # or ref https://json-schema.org/draft/2020-12/schema".
          #
          # Validation strategy: TRUST MAIN'S SCHEMA. The main-branch
          # schema is the fail-closed contract; a PR cannot redefine its
          # own fixer-validation rules.
          #
          # NARROW BOOTSTRAP SHIM: if the artifact references blocker
          # namespaces (addressed[] or skipped[].id) that don't satisfy
          # main's pattern AND the PR-head schema's pattern is a strict
          # superset of main's, validate against the PR-head schema.
          # Mirrors the role-bootstrap shim in review-reviewer.yml.
          MAIN_SCHEMA=".github/scripts/review/schema/fix-result-v1.json"
          PR_SCHEMA="${PR_WORKSPACE_PATH}/.github/scripts/review/schema/fix-result-v1.json"
          # Try main first.
          if npx -y ajv-cli@5 validate --spec=draft2020 -s "$MAIN_SCHEMA" -d "$ARTIFACT" 2>/dev/null; then
            echo "Fix-result validated against main schema."
          else
            # Confirm PR-head schema is a superset before trusting.
            MAIN_PATTERN=$(jq -r '.properties.addressed.items.pattern' "$MAIN_SCHEMA")
            PR_PATTERN=$(jq -r '.properties.addressed.items.pattern' "$PR_SCHEMA")
            # Extract the alternation group from both: e.g. "design|security|psych|docs|prompt"
            MAIN_NS=$(echo "$MAIN_PATTERN" | sed -nE 's|^\^\(([^)]+)\)/.\+\$$|\1|p')
            PR_NS=$(echo "$PR_PATTERN" | sed -nE 's|^\^\(([^)]+)\)/.\+\$$|\1|p')
            for ns in $(echo "$MAIN_NS" | tr '|' ' '); do
              if ! echo "|${PR_NS}|" | grep -q "|${ns}|"; then
                echo "ERROR: PR-head fix-result schema removes namespace '$ns'. Refusing bootstrap shim." >&2
                exit 1
              fi
            done
            UNION_NS=$(echo "$MAIN_NS|$PR_NS" | tr '|' '\n' | sort -u | paste -sd '|')
            TEMP_SCHEMA=$(mktemp /tmp/bootstrap-fixer-XXXXXX.json)
            jq --arg p "^(${UNION_NS})/.+\$" '
              .properties.addressed.items.pattern = $p |
              .properties.skipped.items.properties.id.pattern = $p
            ' "$MAIN_SCHEMA" > "$TEMP_SCHEMA"
            echo "Fix-result failed main schema; derived temp schema with union namespace pattern — applying bootstrap shim."
            npx -y ajv-cli@5 validate --spec=draft2020 -s "$TEMP_SCHEMA" -d "$ARTIFACT"
            rm -f "$TEMP_SCHEMA"
          fi

      # Install the tools that .githooks/pre-commit invokes via
      # scripts/run-required-checks.sh. The host commit step below sets
      # core.hooksPath=.githooks, which activates the same hook a
      # developer runs locally — and the hook hard-fails when any of its
      # required commands are missing. GH Actions runners don't ship
      # yamllint / ruff, so without this step the hook aborts the commit
      # with "required command 'yamllint' is not installed" the moment
      # the fixer stages a workflow file. shellcheck is already on
      # ubuntu-latest; python3 is too.
      #
      # pytest is deliberately NOT installed here. Running the unit suite
      # needs the project's full runtime dependency set importable, and
      # installing the PR's own pyproject.toml would execute PR-authored
      # build configuration inside this job — the one pipeline stage that
      # holds WORKFLOW_PAT and contents:write. The host commit therefore
      # sets HML_SKIP_HOOK_PYTEST=1; pytest-unit runs as a required check
      # in python-validation.yml, on a read-only runner with no secrets,
      # which is the correct place to execute untrusted test code.
      - name: Install pre-commit hook tooling
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user \
            yamllint==1.37.1 \
            ruff==0.15.13
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Auto-fix pass, scoped to the files the fixer actually touched.
      # The fixer prompt forbids running ruff (see fixer.md) — lint is a
      # CI gate step, not a fixer step — so the fixer has no way to catch
      # its own mechanical lint slips. Without this pass, a single
      # auto-fixable violation (an unused import left behind while
      # rewriting a test) hard-fails the terminal gate below and discards
      # the entire cycle's work, forcing a human to hand-apply fixes the
      # tool can repair deterministically. Observed on PR #626: one F401
      # cost a full reviewer fan-out plus fixer run.
      #
      # Scope is deliberate. Only paths that differ from HEAD are passed
      # to `--fix`, so this repairs what the fixer wrote and never
      # silently launders a pre-existing lint regression on main — those
      # still hard-fail the full-tree gate below with their own message.
      # `--exit-zero` keeps the non-auto-fixable case flowing through to
      # that gate, which stays the single place a violation blocks a push.
      - name: Ruff auto-fix (fixer-touched files)
        working-directory: ${{ env.PR_WORKSPACE_PATH }}
        env:
          MERGE_STATE: ${{ steps.sync-main.outputs.merge_state }}
        run: |
          set -euo pipefail
          if ! command -v ruff >/dev/null 2>&1; then
            echo "::warning::ruff not found on host runner; skipping auto-fix pass"
            exit 0
          fi
          if [ "$MERGE_STATE" = "conflicts" ]; then
            echo "merge conflict repair in progress; skipping ruff auto-fix because HEAD includes main-side merge deltas"
            exit 0
          fi

          mapfile -t CHANGED_PY < <(
            { git diff --name-only --diff-filter=d HEAD -- '*.py'; \
              git ls-files --others --exclude-standard -- '*.py'; } | sort -u
          )
          if [ "${#CHANGED_PY[@]}" -eq 0 ]; then
            echo "fixer touched no Python files; nothing to auto-fix"
            exit 0
          fi

          echo "=== Ruff auto-fix on ${#CHANGED_PY[@]} fixer-touched file(s) ==="
          printf '  %s\n' "${CHANGED_PY[@]}"
          ruff check --fix --exit-zero -- "${CHANGED_PY[@]}"

      # Lint gate: run ruff against the full Python tree in the PR
      # workspace before committing. The pre-commit hook in .githooks/
      # only covers *staged* files, so it cannot catch violations that
      # were already present in the tree when the fixer ran (e.g. a
      # lint regression merged to main before the fixer's cycle). This
      # step runs on the host (not inside the container) and checks the
      # entire tree — the same scope as python-validation.yml's ruff job
      # — so the fixer cannot push a commit that would fail the
      # Python Validation Required required check.
      #
      # Failure here is intentional: it surfaces the violation before the
      # push and forces a human to fix the upstream regression rather than
      # letting the fixer silently carry it forward. The fixer is not
      # expected to fix pre-existing lint regressions it didn't introduce;
      # those should be addressed in a separate PR on main.
      - name: Ruff lint gate (full tree, pre-commit)
        working-directory: ${{ env.PR_WORKSPACE_PATH }}
        run: |
          set -euo pipefail
          if ! command -v ruff >/dev/null 2>&1; then
            echo "::warning::ruff not found on host runner; skipping pre-commit lint gate"
            exit 0
          fi
          echo "=== Ruff lint on full Python tree ==="
          ruff check app/ tests/ scripts/ || {
            echo "::error::ruff found violations in the PR tree. The fixer will not push a commit that fails the Python Validation ruff gate."
            echo "::error::If the violations are pre-existing on main (not introduced by this PR), open a separate PR on main to fix them first."
            exit 1
          }

      # Commit the fixer's working-tree changes from the host runner
      # rather than from inside the CI container. The container runs
      # as UID 1000 (`ci` user) and the bind-mounted workspace's
      # `.git/` directory is owned by the runner UID (1001), so any
      # git-write operation from inside the container fails with
      # "cannot update the ref 'HEAD': unable to append to
      # '.git/logs/HEAD': Permission denied". Doing the commit on
      # the host means git ops run as the workspace owner, which
      # "just works". The fixer prompt has been updated to leave
      # the working tree unstaged and set new_sha to REVIEWED_SHA;
      # this step computes the real new_sha and patches it into the
      # artifact so the downstream push step reads a consistent SHA.

      - name: Commit fixer working-tree changes
        id: commit
        env:
          ARTIFACT: ${{ steps.artifact-path.outputs.result_json }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          HEAD_REF: ${{ inputs.head_ref }}
          MERGE_STATE: ${{ steps.sync-main.outputs.merge_state }}
          MERGE_CONFLICT_FILES: ${{ steps.sync-main.outputs.conflict_files }}
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          # Activate the pre-commit hook for staged-file checks. The hook
          # is in .githooks/ (not .git/hooks/) so git won't find it unless
          # core.hooksPath is set. The fixer container sets this via
          # GIT_CONFIG env vars, but the host-side commit step is a plain
          # runner shell — it needs the env-based config override too.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: .githooks
          # See "Install pre-commit hook tooling" above: the unit suite
          # needs the project installed, which this job deliberately does
          # not do. python-validation.yml's pytest-unit required check
          # covers the same ground without secrets in scope.
          HML_SKIP_HOOK_PYTEST: "1"
        working-directory: ${{ env.PR_WORKSPACE_PATH }}
        run: |
          set -euo pipefail

          MERGING="false"
          if git rev-parse --quiet --verify MERGE_HEAD >/dev/null 2>&1; then
            MERGING="true"
          fi

          if [ "$MERGING" = "false" ] && git diff --quiet && git diff --cached --quiet; then
            echo "fixer produced no working-tree changes; no commit needed"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "hide-my-list-ci[bot]"
          git config user.email "ci@hide-my-list.local"
          git add -A

          # If we're sealing a merge from origin/main, every conflict
          # marker must be resolved before commit. `git ls-files -u`
          # reports any path still tracked as unmerged in the index;
          # `git diff --check --cached` catches literal `<<<<<<<` /
          # `=======` / `>>>>>>>` lines in staged content.
          if [ "$MERGING" = "true" ]; then
            UNRESOLVED_INDEX=$(git ls-files -u | awk '{print $4}' | sort -u || true)
            MARKER_FILES=$(git diff --check --cached 2>/dev/null | awk -F: '/conflict marker/ {print $1}' | sort -u || true)
            if [ -n "$UNRESOLVED_INDEX" ] || [ -n "$MARKER_FILES" ]; then
              REMAINING=$(printf '%s\n%s\n' "$UNRESOLVED_INDEX" "$MARKER_FILES" | grep -v '^$' | sort -u | tr '\n' ',' | sed 's/,$//')
              [ -n "$REMAINING" ] || REMAINING="${MERGE_CONFLICT_FILES}"
              echo "::error::fixer did not resolve all merge conflicts; aborting merge from origin/main"
              echo "::error::unresolved files: ${REMAINING}"
              git merge --abort || true

              gh label create "needs-human-review" \
                --color "d73a4a" \
                --description "Pipeline could not auto-resolve merge conflicts" \
                --repo "${REPO}" 2>/dev/null || true
              gh pr edit "${PR_NUMBER}" --add-label "needs-human-review" --repo "${REPO}" || true
              gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "$(printf 'The review pipeline attempted to merge `origin/main` into this PR, but the fixer agent could not resolve all conflict markers. Manual rebase/merge required.\n\nUnresolved files: %s\n\nLabeled `needs-human-review`. After resolving the conflicts and pushing, re-trigger the pipeline with a `/review` comment.' "${REMAINING}")" || true

              echo "committed=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi

          # Build the commit message based on what we're sealing.
          ADDRESSED=$(jq -r '(.addressed // []) | join(", ")' "$ARTIFACT")

          if [ "$MERGING" = "true" ] && [ -z "$ADDRESSED" ]; then
            MSG_SUBJECT="Merge origin/main into ${HEAD_REF}"
            MSG_BODY="Pipeline-driven sync; conflicts resolved by the fixer agent."
          elif [ "$MERGING" = "true" ]; then
            MSG_SUBJECT="Merge origin/main + apply fixes for ${ADDRESSED}"
            MSG_BODY="Pipeline-driven sync with reviewer-blocker fixes applied in the same commit."
          elif [ -z "$ADDRESSED" ]; then
            echo "::error::fixer has working-tree changes but addressed[] is empty"
            git status --short
            exit 1
          else
            MSG_SUBJECT="review-pipeline-v2: apply fixes for ${ADDRESSED}"
            MSG_BODY="Addresses blockers requested by the reviewers."
          fi

          git commit -m "$MSG_SUBJECT" -m "$MSG_BODY"

          NEW_SHA=$(git rev-parse HEAD)
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "new_sha=${NEW_SHA}" >> "$GITHUB_OUTPUT"

          # Patch the fixer-result.json so the downstream Claim step
          # (and the judge) read the real post-commit SHA instead of
          # the placeholder the agent wrote. $ARTIFACT is an absolute
          # host path emitted by the review-codex-run action.
          TMP=$(mktemp)
          jq --arg new_sha "$NEW_SHA" '.new_sha = $new_sha' "$ARTIFACT" > "$TMP"
          mv "$TMP" "$ARTIFACT"

      - name: Push new SHA, then claim it
        id: push
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          REPO: ${{ github.repository }}
          ARTIFACT: ${{ steps.artifact-path.outputs.result_json }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          HEAD_REF: ${{ inputs.head_ref }}
        run: |
          set -euo pipefail

          INPUT_SHA=$(jq -r '.input_sha' "$ARTIFACT")
          NEW_SHA=$(jq -r '.new_sha' "$ARTIFACT")

          if [ "$INPUT_SHA" != "$REVIEWED_SHA" ]; then
            echo "::error::fixer reported input_sha=$INPUT_SHA but reviewed_sha=$REVIEWED_SHA"
            exit 1
          fi

          if [ "$NEW_SHA" = "$REVIEWED_SHA" ]; then
            echo "fixer was a no-op; nothing to push"
            echo "new_sha=$REVIEWED_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Push from the PR workspace, which has the PAT-authenticated remote.
          cd "${{ env.PR_WORKSPACE_PATH }}"
          REMOTE_HEAD=$(git ls-remote --heads origin "refs/heads/${HEAD_REF}" | awk 'NR==1 {print $1}')
          if [ -z "$REMOTE_HEAD" ] || [ "$REMOTE_HEAD" != "$REVIEWED_SHA" ]; then
            TMP_ARTIFACT=$(mktemp)
            jq \
              --arg reviewed_sha "$REVIEWED_SHA" \
              --arg remote_head "$REMOTE_HEAD" \
              --arg head_ref "$HEAD_REF" \
              '
              def push_skip_reason:
                if $remote_head == "" then
                  "Not pushed because origin/" + $head_ref + " no longer exists after gather froze " + $reviewed_sha + "."
                else
                  "Not pushed because origin/" + $head_ref + " advanced to " + $remote_head + " after gather froze " + $reviewed_sha + "."
                end;
              .new_sha = $reviewed_sha
              | .skipped = (
                  (.skipped // [])
                  + ((.addressed // []) | map({id: ., reason: push_skip_reason}))
                  | if length == 0 then
                      [{id: "docs/review-pipeline-head-moved", reason: push_skip_reason}]
                    else
                      .
                    end
                )
              | .addressed = []
              ' "$ARTIFACT" > "$TMP_ARTIFACT"
            mv "$TMP_ARTIFACT" "$ARTIFACT"

            if [ -z "$REMOTE_HEAD" ]; then
              echo "origin/${HEAD_REF} no longer exists; refusing to push fixer commit built from ${REVIEWED_SHA}"
            else
              echo "origin/${HEAD_REF} moved to ${REMOTE_HEAD}; refusing to push fixer commit built from ${REVIEWED_SHA}"
            fi

            echo "new_sha=$REVIEWED_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Push first, claim immediately after.
          #
          # The original design tried to write a `pending` status on
          # NEW_SHA *before* pushing to close the synchronize-event
          # race window. But GitHub's commit-status API returns 422
          # for SHAs it hasn't seen yet, so the pre-push claim was
          # impossible — the SHA only exists on the remote after the
          # push completes.
          #
          # Push then claim. The synchronize event GitHub fires for
          # the push takes a few seconds to schedule. If that event
          # un-queues while this claim is pending, entry's dedup lock
          # skips it. If this cycle reaches a judge verdict first,
          # entry recognizes the fixer post-push claim in the SHA's
          # status history and skips the automatic re-entry before it
          # consumes a cycle.
          git push origin "HEAD:${HEAD_REF}"

          gh api -X POST "repos/${REPO}/statuses/${NEW_SHA}" \
            -f state=pending \
            -f context=review/pipeline \
            -f description="cycle=${{ inputs.cycle }} (fixer post-push claim)" >/dev/null

          echo "new_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"

      - name: Write fix commit status
        uses: ./.github/actions/review-state
        with:
          op: write-status
          sha: ${{ inputs.reviewed_sha }}
          context: review/fix
          state: success
          description: 'cycle=${{ inputs.cycle }}'
          github_token: ${{ secrets.WORKFLOW_PAT }}

      - name: Upload fix-result artifact
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: fix-result-${{ inputs.reviewed_sha }}
          path: |
            ${{ env.PR_WORKSPACE_PATH }}/.review-output/fixer-result.json
            ${{ env.PR_WORKSPACE_PATH }}/.review-output/fixer-output.jsonl
