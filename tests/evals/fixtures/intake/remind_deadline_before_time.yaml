---
# Surface: a task with a deadline phrased as "<chore> <weekday> before
# <time>" and no notification-intent word ("remind me", "ping me"). Per
# docs/ai-prompts/intake.md this is DEADLINE detection, not reminder
# detection: intake sets due_at to the named wall-clock bound (Friday
# 22:00 local) and the deadline reminder series is scheduled from due_at.
# The user-visible confirmation must acknowledge the deadline — a
# confirmation that silently drops "Friday before 10pm" leaves the user
# believing the time bound was captured when it wasn't.
#
# An underpowered medium-tier model may also fail here by emitting
# truncated/unparseable JSON; intake_node then takes the honest
# parse-failure path, which says timing was NOT captured — that reply
# fails the judge contract below, as it should.
id: intake-remind-deadline-before-time-001
node: intake
tier: medium
peer: "<test-peer-5>"
inbound: "I need to clean the kitchen Friday before 10pm"
prior_state:
  active_task: null
  conversation_state: idle
  user_prefs:
    timezone: America/Chicago
contracts:
  # Deterministic discriminator: the confirmation must carry the deadline.
  # A generic "Got it — added" with no time bound fails here.
  - kind: regex_require
    pattern: "(?i)(friday|deadline|due|by\\s*10|before\\s*10)"
  - kind: regex_forbid
    pattern: "(?i)(cron|worker|queue|outbox|notion)"
  - kind: judge
    rubric: |
      The user-visible response confirms the task was captured WITH its
      deadline: it acknowledges the Friday-before-10pm (or equivalent
      phrasing of that evening) time bound. It does NOT mention internal
      infrastructure (cron, worker, queue, outbox). Score 1.0 when the
      confirmation clearly ties the task to the Friday deadline, 0.5 when
      it confirms a deadline without the specific day/time, 0.0 for a
      task-only confirmation with no deadline or an admission that timing
      was not captured.
    threshold: 0.7
