---
# Intake contract: the save confirmation must use the literal {task} token
# wherever it names the saved task — for non-reminder saves (inline steps).
# Catches regression to the old prompt examples that instructed the model
# to write generic confirmations ("Got it — focus, ~30 min.") without naming
# the task, which send_node then had to patch with a fallback sentence.
id: intake-task-named-in-confirmation-001
node: intake
tier: medium
peer: "<test-peer-intake-named>"
inbound: "I need to finish the placeholder report"
prior_state:
  active_task: null
  conversation_state: idle
  user_prefs:
    timezone: America/Chicago
contracts:
  - kind: regex_require
    pattern: "\\{task\\}"
  - kind: regex_forbid
    pattern: "(?i)(remind|reminder|notify|notification|set\\s+a\\s+(notification|reminder|alert))"
  # The regex_require above asserts the literal {task} token on the raw
  # draft body. This judge contract scores the DELIVERED body (token already
  # substituted by the runner, mirroring send_node), so it checks the user
  # experience: the confirmation names the specific saved task.
  - kind: judge
    rubric: |
      The save confirmation refers to the saved task by its specific name
      or a clear shortening of it — not a vague description like
      "your task", "this focus task", or "it". Score 1.0 if the task is
      named; 0.0 if only a vague reference appears.
    threshold: 0.8
