---
# Check-in contract: the check-in message must use the literal {task} token
# to refer to the active task, never a vague attribute-only reference.
# Catches regression to the old behavior where the model wrote "this focus task"
# or "your task" instead of {task}, which the application substitutes with the
# exact stored title before delivery.
id: check-in-task-named-001
node: check_in
tier: medium
peer: "<test-peer-checkin-named>"
inbound: "__CHECK_IN__"
prior_state:
  active_task:
    page_id: "<placeholder-page-id>"
    title: "Reorganize the pantry shelves"
    check_in_count: 0
    time_estimate: 30
  conversation_state: active
contracts:
  - kind: shame_safe
    threshold: 0.85
  - kind: regex_require
    pattern: "\\{task\\}"
  - kind: regex_forbid
    pattern: "(?i)(this\\s+focus\\s+task|this\\s+task|your\\s+task|the\\s+task|that\\s+task)(?!\\s+is\\b)"
  # The regex_require above asserts the literal {task} token on the raw
  # draft body. This judge contract scores the DELIVERED body (token already
  # substituted by the runner, mirroring send_node), so it checks the user
  # experience: the message names the specific task.
  - kind: judge
    rubric: |
      The check-in message refers to the active task by its specific name
      ("Reorganize the pantry shelves" or a clear shortening of it) — not
      a vague description like "this focus task", "your task", or "the
      task". Score 1.0 if the task is named; 0.0 if only a vague
      reference appears.
    threshold: 0.85
